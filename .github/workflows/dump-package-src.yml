name: dump-package-src
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump targeted source files
        run: |
          mkdir -p /tmp/pkg
          curl -L --fail --retry 3 -o /tmp/pkg.tar.gz "https://pub.dev/api/archives/recite_quran-1.0.5.tar.gz"
          tar xzf /tmp/pkg.tar.gz -C /tmp/pkg
          rm -rf pkg-src
          mkdir pkg-src
          cd /tmp/pkg
          find lib doc -type f -exec wc -c {} + | sort -k2 > "$GITHUB_WORKSPACE/pkg-src/tree.txt"
          dump() {
            out="$GITHUB_WORKSPACE/pkg-src/$1"; shift; : > "$out"
            for f in "$@"; do
              if [ -f "$f" ]; then echo "=== FILE: $f ===" >> "$out"; cat "$f" >> "$out"; echo >> "$out"; fi
            done
          }
          dump tajweed.txt $(ls lib/tracking/tajweed/*.dart) doc/TAJWEED_GUIDE.md
          dump matching.txt $(ls lib/tracking/word/*.dart) lib/tracking/tracker_config.dart
          dump data.txt lib/data/quran_data.dart
          ls -la "$GITHUB_WORKSPACE/pkg-src"
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A pkg-src
          git commit -m "dump recite_quran source (targeted)" || echo "nothing to commit"
          git push
