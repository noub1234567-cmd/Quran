name: build-apk

# Runs automatically when this file is pushed to the apk-build branch,
# and manually: Actions tab -> build-apk -> Run workflow
on:
  workflow_dispatch:
  push:
    branches: [apk-build]
    paths:
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only the main app goes into the APK. recite/ and tartil/ are never copied.
      - name: Collect only the main app files
        run: |
          set -euo pipefail
          rm -rf www
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          ls -la www

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Customize Android project (microphone, icons, version)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # Microphone permission (needed for recitation recording)
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <application#' "$MANIFEST"
          grep -c RECORD_AUDIO "$MANIFEST"

          # Adaptive icon background = colour sampled from the icon corner (fallback: theme green)
          RAW=$(convert icon-512.png -format '%[hex:p{3,3}]' info:)
          BG=${RAW:0:6}
          if [ ${#RAW} -eq 8 ] && [ "${RAW:6:2}" != "FF" ] && [ "${RAW:6:2}" != "ff" ]; then BG=0B5D52; fi
          if [ -z "$BG" ]; then BG=0B5D52; fi
          echo "icon background: #$BG"

          mkdir -p "$RES/values" "$RES/mipmap-anydpi-v26"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="hq_icon_bg">#%s</color>\n</resources>\n' "$BG" > "$RES/values/hq_colors.xml"

          # Launcher icons: legacy square icon + padded foreground (safe zone) for adaptive icon
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read -r d L F <<< "$spec"
            I=$((F * 61 / 100))
            D="$RES/mipmap-$d"
            mkdir -p "$D"
            convert icon-512.png -resize "${L}x${L}" "$D/ic_launcher.png"
            cp "$D/ic_launcher.png" "$D/ic_launcher_round.png"
            convert -size "${F}x${F}" xc:none \( icon-512.png -resize "${I}x${I}" \) -gravity center -composite "$D/hq_icon_fg.png"
          done
          find "$RES" -name 'ic_launcher*.webp' -delete

          for n in ic_launcher ic_launcher_round; do
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <background android:drawable="@color/hq_icon_bg"/>' \
              '    <foreground android:drawable="@mipmap/hq_icon_fg"/>' \
              '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/$n.xml"
          done

          # Each build gets a higher version code
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Sync web files into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hifz-quran.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hifz-quran-apk
          path: hifz-quran.apk
          retention-days: 30
          
