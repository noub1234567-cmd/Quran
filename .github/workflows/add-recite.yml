name: add-recite
on: workflow_dispatch
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and patch Natlu
        run: |
          curl -L --fail -o /tmp/natlu.zip "https://huggingface.co/noubou/Natlu/resolve/main/Recite-Quran-Natlu-2d443d2.zip"
          unzip -q /tmp/natlu.zip -d /tmp/natlu
          rm -rf recite
          cp -r /tmp/natlu/*/landing_page/recite recite
          python3 - <<'E'
          import os
          r = os.environ['GITHUB_REPOSITORY'].split('/')[1]
          def patch(path, pairs):
              s = open(path, encoding='utf-8').read()
              for a, b in pairs:
                  assert a in s, (path, a)
                  s = s.replace(a, b)
              open(path, 'w', encoding='utf-8').write(s)
          dbg = '<script>if(/[?&]debug/.test(location.search)){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/eruda@3.0.1";s.onload=function(){eruda.init()};document.head.appendChild(s)}</script>'
          patch('recite/index.html', [
              ('<base href="/recite/">', '<base href="/%s/recite/">' % r + dbg),
              ('for (const reg of regs) await reg.unregister();',
               "for (const reg of regs) if (reg.scope.includes('/recite/')) await reg.unregister();"),
              ('for (const k of keys) await caches.delete(k);',
               "for (const k of keys) if (k.startsWith('recite-quran-pwa-')) await caches.delete(k);"),
          ])
          patch('recite/sw.js', [
              (r"/^\/recite\//", r"/^\/%s\/recite\//" % r),
              ('keys.filter((k) => k !== CACHE_NAME)',
               "keys.filter((k) => k.startsWith('recite-quran-pwa-') && k !== CACHE_NAME)"),
              ("recite-quran-pwa-v18-1792016698", "recite-quran-pwa-v18-gh3"),
              ("if (url.pathname.includes('/download-model')) return;",
               "if (url.pathname.includes('/download-model') || url.pathname.endsWith('.onnx')) return;"),
          ])
          patch('recite/sherpa_official_app.js', [
              ("const url = '/download-model?model=' + filename;",
               "const url = new URL('assets/assets/model/' + filename, document.baseURI).href;"),
              ("window.fetchSherpaModel = async function(url) {",
               "window.fetchSherpaModel = async function(url) {\n  url = new URL('assets/assets/model/quran_phoneme_zipformer.int8.onnx', document.baseURI).href;"),
              ("supportsRanges = headRes.headers.get('accept-ranges') === 'bytes';",
               "supportsRanges = false;"),
          ])
          E
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add recite
          git commit -m "add recite" || echo "nothing to commit"
          git push
