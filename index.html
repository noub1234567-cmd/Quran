<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>حفظ القرآن</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f0f7f6;color:#10312e;padding-bottom:90px}
  header{background:#0f766e;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:700}
  .card{background:#fff;margin:12px;padding:14px;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h2{margin:0 0 10px;font-size:16px;color:#0f766e}
  label{display:block;font-size:13px;margin:8px 0 4px}
  select,input{width:100%;padding:10px;font-size:16px;border:1px solid #b7d4d1;border-radius:10px;background:#fff;color:inherit}
  .row{display:flex;gap:8px}.row>div{flex:1}
  button{font-size:16px;border:0;border-radius:10px;padding:12px;cursor:pointer}
  .primary{background:#0f766e;color:#fff;width:100%;margin-top:12px}
  .list{margin:12px}
  .item{display:flex;align-items:center;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .item .play{flex:1;text-align:right;background:none;padding:14px;color:inherit}
  .item .num{display:inline-block;min-width:34px;color:#0f766e;font-weight:700}
  .item .dl{background:#e3f1ef;color:#0f766e;margin:6px;padding:8px 10px;font-size:13px;border-radius:8px}
  .item .dl.done{background:#0f766e;color:#fff}
  #bar{position:fixed;bottom:0;left:0;right:0;background:#10312e;color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
  #status{flex:1;font-size:14px}
  #stop{background:#e11d48;color:#fff;padding:8px 16px}
  #note{font-size:12px;color:#5b7a77;margin:12px;text-align:center}
</style>
</head>
<body>
<header>حفظ القرآن</header>

<div class="card">
  <h2>التكرار للحفظ</h2>
  <label for="surah">السورة</label>
  <select id="surah"></select>
  <div class="row">
    <div><label for="from">من آية</label><input id="from" type="number" min="1" value="1" inputmode="numeric"></div>
    <div><label for="to">إلى آية</label><input id="to" type="number" min="1" value="1" inputmode="numeric"></div>
    <div><label for="reps">عدد المرات</label><input id="reps" type="number" min="1" value="10" inputmode="numeric"></div>
  </div>
  <button class="primary" id="go">▶ ابدأ التكرار</button>
</div>

<div class="list" id="list"></div>
<p id="note">الصوت: مشاري العفاسي، عبر cdn.islamic.network. اضغط «تحميل» بجانب أي سورة لتعمل دون إنترنت.</p>

<div id="bar"><div id="status">اضغط على سورة للاستماع</div><button id="stop">إيقاف</button></div>
<audio id="player" preload="auto"></audio>

<script>
const COUNTS=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const NAMES="الفاتحة،البقرة،آل عمران،النساء،المائدة،الأنعام،الأعراف،الأنفال،التوبة،يونس،هود،يوسف،الرعد،إبراهيم،الحجر،النحل،الإسراء،الكهف،مريم،طه،الأنبياء،الحج،المؤمنون،النور،الفرقان،الشعراء،النمل،القصص،العنكبوت،الروم،لقمان،السجدة،الأحزاب،سبأ،فاطر،يس،الصافات،ص،الزمر،غافر،فصلت،الشورى،الزخرف،الدخان،الجاثية،الأحقاف،محمد،الفتح،الحجرات،ق،الذاريات،الطور،النجم،القمر،الرحمن،الواقعة،الحديد،المجادلة،الحشر،الممتحنة،الصف،الجمعة،المنافقون،التغابن،الطلاق،التحريم،الملك،القلم،الحاقة،المعارج،نوح،الجن،المزمل،المدثر،القيامة،الإنسان،المرسلات،النبأ،النازعات،عبس،التكوير،الانفطار،المطففين،الانشقاق،البروج،الطارق،الأعلى،الغاشية،الفجر،البلد،الشمس،الليل،الضحى،الشرح،التين،العلق،القدر،البينة،الزلزلة،العاديات،القارعة،التكاثر،العصر،الهمزة،الفيل،قريش،الماعون،الكوثر،الكافرون،النصر،المسد،الإخلاص،الفلق،الناس".split("،");
const OFFSET=[];let acc=0;COUNTS.forEach(c=>{OFFSET.push(acc);acc+=c;});
const pad=n=>String(n).padStart(3,'0');
const SOURCES=[
  (s,a)=>'https://cdn.islamic.network/quran/audio/128/ar.alafasy/'+(OFFSET[s-1]+a)+'.mp3',
  (s,a)=>'https://cdn.islamic.app/quran/audio/ar.alafasy/'+(OFFSET[s-1]+a)+'.mp3',
  (s,a)=>'https://everyayah.com/data/Alafasy_128kbps/'+pad(s)+pad(a)+'.mp3',
  (s,a)=>'https://verses.quran.com/Alafasy/mp3/'+pad(s)+pad(a)+'.mp3'
];
const CACHE_NAME='ayah-audio';
const urlOf=(s,a,i=0)=>SOURCES[i](s,a);

const $=id=>document.getElementById(id);
const player=$('player'),statusEl=$('status');
let token=0,pendingResolve=null;
let downloaded=new Set(JSON.parse(localStorage.getItem('dl')||'[]'));

// ---- واجهة ----
NAMES.forEach((n,i)=>{
  const o=document.createElement('option');o.value=i+1;o.textContent=(i+1)+' - '+n;$('surah').appendChild(o);
  const d=document.createElement('div');d.className='item';
  d.innerHTML=`<button class="play" data-s="${i+1}"><span class="num">${i+1}</span> ${n} <small>(${COUNTS[i]} آية)</small></button><button class="dl" data-s="${i+1}"></button>`;
  $('list').appendChild(d);
});
function refreshDl(){
  document.querySelectorAll('.dl').forEach(b=>{
    const done=downloaded.has(+b.dataset.s);
    b.textContent=done?'✓ محمّلة':'تحميل';b.classList.toggle('done',done);
  });
}
refreshDl();
function setRange(s){$('surah').value=s;$('from').value=1;$('to').value=COUNTS[s-1];}
$('surah').onchange=()=>setRange(+$('surah').value);
setRange(1);

$('list').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const s=+b.dataset.s;
  if(b.classList.contains('play')){setRange(s);$('reps').value=1;run(s,1,COUNTS[s-1],1);}
  else downloadSurah(s,b);
};
$('go').onclick=()=>{
  const s=+$('surah').value,max=COUNTS[s-1];
  let f=Math.max(1,+$('from').value||1),t=Math.min(max,+$('to').value||max),r=Math.max(1,+$('reps').value||1);
  if(f>t)[f,t]=[t,f];
  $('from').value=f;$('to').value=t;
  run(s,f,t,r);
};
$('stop').onclick=stop;

// ---- التشغيل ----
function stop(){
  token++;player.pause();
  if(pendingResolve){pendingResolve(false);pendingResolve=null;}
  statusEl.textContent='تم الإيقاف';
}
async function run(s,from,to,reps){
  stop();const my=token;
  for(let r=1;r<=reps;r++){
    for(let a=from;a<=to;a++){
      if(my!==token)return;
      statusEl.textContent=`${NAMES[s-1]} · آية ${a} · المرة ${r} من ${reps}`;
      const ok=await playAyah(s,a);
      if(my!==token)return;
      if(!ok){statusEl.textContent='تعذّر تشغيل الصوت. تحقق من الإنترنت أو حمّل السورة.';return;}
    }
  }
  if(my===token)statusEl.textContent='انتهى التشغيل';
}
function playAyah(s,a){
  return new Promise(async res=>{
    pendingResolve=res;
    const key=urlOf(s,a,0);let obj=null,cached=false;
    const srcs=[];
    try{
      const c=await caches.open(CACHE_NAME),hit=await c.match(key);
      if(hit){obj=URL.createObjectURL(await hit.blob());srcs.push(obj);cached=true;}
    }catch(e){}
    for(let i=0;i<SOURCES.length;i++)srcs.push(urlOf(s,a,i));
    let k=0;
    const finish=v=>{player.onended=player.onerror=null;if(obj)URL.revokeObjectURL(obj);pendingResolve=null;res(v);};
    const tryNext=()=>{
      if(k>=srcs.length)return finish(false);
      player.onended=()=>finish(true);
      player.onerror=()=>{k++;tryNext();};
      player.src=srcs[k];
      player.play().catch(()=>{k++;tryNext();});
    };
    tryNext();
  });
}

// ---- التحميل للعمل دون إنترنت ----
async function downloadSurah(s,btn){
  if(downloaded.has(s)){
    if(!confirm('حذف هذه السورة من التخزين؟'))return;
    const c=await caches.open(CACHE_NAME);
    for(let a=1;a<=COUNTS[s-1];a++)await c.delete(urlOf(s,a));
    downloaded.delete(s);localStorage.setItem('dl',JSON.stringify([...downloaded]));refreshDl();return;
  }
  btn.disabled=true;
  try{
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
    const c=await caches.open(CACHE_NAME),n=COUNTS[s-1];
    for(let a=1;a<=n;a++){
      btn.textContent=`${a}/${n}`;
      const key=urlOf(s,a,0);
      if(await c.match(key))continue;
      let ok=false,last='';const errs=[];
      for(let i=0;i<SOURCES.length&&!ok;i++){
        try{
          const r=await fetch(urlOf(s,a,i));
          if(!r.ok){last='http '+r.status;errs.push(i+':'+last);continue;}
          await c.put(key,r);ok=true;
        }catch(err){last=String(err&&err.message||err);errs.push(i+':'+last);}
      }
      if(!ok)throw new Error(errs.join(' | '));
    }
    downloaded.add(s);localStorage.setItem('dl',JSON.stringify([...downloaded]));
  }catch(e){
    alert('تعذّر إكمال التحميل.\nالسبب التقني: '+(e&&e.message||e));
  }
  btn.disabled=false;refreshDl();
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
